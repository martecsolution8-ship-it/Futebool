name: MarBet import football-data.co.uk

on:
  schedule:
    - cron: "30 5 * * *"   # antes do workflow de inteligência (06:00 UTC)
  workflow_dispatch:
    inputs:
      seasons:
        description: "current | last:N | 2425,2526"
        default: "current"
      leagues:
        description: "top | all | E0,SP1,..."
        default: "top"
      force:
        description: "Reimportar mesmo sem alterações"
        type: boolean
        default: false

concurrency:
  group: marbet-import-footballdata
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Aplicar migrações
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: alembic upgrade head

      - name: Importar football-data.co.uk
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          SEASONS: ${{ inputs.seasons || 'current' }}
          LEAGUES: ${{ inputs.leagues || 'top' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m app.run_import_footballdata --seasons "$SEASONS" --leagues "$LEAGUES" $FORCE
