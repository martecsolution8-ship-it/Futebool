name: MarBet ingest odds

on:
  schedule:
    - cron: "10 5,17 * * *"   # 2x por dia, antes do workflow de inteligência (06:00 e 18:00 UTC)
  workflow_dispatch:

concurrency:
  group: marbet-ingest-odds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Aplicar migrações
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: alembic upgrade head

      - name: Recolher odds
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FIVE_DOLLAR_API_KEY: ${{ secrets.FIVE_DOLLAR_API_KEY }}
        run: python -m app.run_ingest_odds
